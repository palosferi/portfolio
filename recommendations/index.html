  :root {
    --bg:         #0d1117;
    --rule:       #222b35;
    --rule-soft:  #1a222b;
    --ink:        #c4ccd6;
    --ink-strong: #edf1f5;
    --ink-mute:   #77828e;
    --accent:     #c8a45c;

    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --sans:  "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    --measure: 60ch;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 60rem;
    margin: 0 auto;
    padding: 2rem 1.5rem 6rem;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .skip {
    position: absolute;
    left: -9999px;
  }
  .skip:focus {
    left: 1.5rem;
    top: 1rem;
    padding: .5rem .75rem;
    background: var(--bg);
    border: 1px solid var(--accent);
    z-index: 10;
  }

  /* ---- masthead ---- */

  .back {
    display: inline-block;
    font-size: .875rem;
    color: var(--ink-mute);
    text-decoration: none;
    padding: .25rem 0;
  }
  .back:hover { color: var(--ink-strong); }

  .lede {
    margin: 3.5rem 0 3rem;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.1rem, 6.5vw, 3.9rem);
    line-height: 1.08;
    letter-spacing: -0.015em;
    color: var(--ink-strong);
    margin: 0 0 1.25rem;
    max-width: 18ch;
    text-wrap: balance;
  }

  .lede p {
    margin: 0;
    max-width: var(--measure);
    color: var(--ink-mute);
    font-size: 1.0625rem;
  }

  /* ---- controls ---- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem 1.25rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--rule);
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin: 0;
    padding: 0;
  }

  .chip {
    font: inherit;
    font-size: .9375rem;
    color: var(--ink-mute);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: .3rem .85rem;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .chip:hover { color: var(--ink-strong); border-color: var(--ink-mute); }
  .chip[aria-pressed="true"] {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }
  .chip .n {
    color: inherit;
    opacity: .6;
    margin-left: .35rem;
  }

  .search {
    flex: 1 1 12rem;
    min-width: 10rem;
  }
  .search input {
    font: inherit;
    font-size: .9375rem;
    width: 100%;
    color: var(--ink-strong);
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: .35rem .1rem;
  }
  .search input::placeholder { color: var(--ink-mute); }
  .search input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  /* ---- list ---- */

  #list {
    transition: opacity .12s ease;
  }
  #list.swapping { opacity: 0; }

  .group + .group { margin-top: 3.5rem; }

  .group h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-style: italic;
    font-size: 1.375rem;
    color: var(--ink-mute);
    margin: 2.5rem 0 0;
  }
  .group.solo h2 { display: none; }

  .entry {
    display: grid;
    grid-template-columns: minmax(0, 11rem) minmax(0, 1fr);
    gap: .5rem 2.5rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .entry h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 1.1875rem;
    line-height: 1.3;
    color: var(--ink-strong);
    margin: 0;
  }

  .entry .by {
    grid-column: 1;
    font-size: .875rem;
    color: var(--ink-mute);
    line-height: 1.45;
  }

  .entry .note {
    grid-column: 2;
    grid-row: 1 / span 2;
    margin: 0;
    max-width: var(--measure);
    align-self: start;
  }

  .entry mark {
    background: rgba(200, 164, 92, .18);
    color: var(--ink-strong);
    border-radius: 2px;
  }

  .empty {
    padding: 3rem 0;
    max-width: var(--measure);
    color: var(--ink-mute);
  }

  footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: .875rem;
    color: var(--ink-mute);
  }
  footer a { color: var(--ink); text-decoration-color: var(--rule); }
  footer a:hover { color: var(--accent); }

  @media (max-width: 44rem) {
    .entry {
      grid-template-columns: 1fr;
      gap: .35rem;
    }
    .entry .note {
      grid-column: 1;
      grid-row: auto;
      margin-top: .5rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

/* ============================================================
   Rendering — you should not need to touch anything below.
   ============================================================ */

const GROUPS = [
  { key: 'book',   label: 'Books'  },
  { key: 'film',   label: 'Films'  },
  { key: 'series', label: 'Series' },
];

const listEl    = document.getElementById('list');
const filtersEl = document.getElementById('filters');
const searchEl  = document.getElementById('q');

let medium = 'all';
let query  = '';

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function highlight(text) {
  const safe = esc(text);
  if (!query) return safe;
  const rx = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(rx, '<mark>$1</mark>');
}

function matches(item) {
  if (medium !== 'all' && item.medium !== medium) return false;
  if (!query) return true;
  const hay = (item.title + ' ' + item.by + ' ' + item.note).toLowerCase();
  return hay.includes(query.toLowerCase());
}

function buildFilters() {
  const counts = { all: DATA.length };
  GROUPS.forEach(g => counts[g.key] = DATA.filter(d => d.medium === g.key).length);

  const opts = [{ key: 'all', label: 'Everything' }, ...GROUPS];
  filtersEl.innerHTML = opts.map(o =>
    `<button class="chip" type="button" data-medium="${o.key}" aria-pressed="false">` +
    `${o.label}<span class="n">${counts[o.key]}</span></button>`
  ).join('');

  filtersEl.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const next = btn.dataset.medium;
    if (next === medium) return;
    location.hash = next === 'all' ? '' : next;
    if (next === 'all') { medium = 'all'; swap(render); }
  });
}

function render() {
  filtersEl.querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.medium === medium))
  );

  const visible = GROUPS
    .map(g => ({ ...g, items: DATA.filter(d => d.medium === g.key && matches(d)) }))
    .filter(g => g.items.length);

  if (!visible.length) {
    listEl.innerHTML =
      `<p class="empty">Nothing matches that. Try a director, an author, or a word from one of the descriptions.</p>`;
    return;
  }

  const solo = visible.length === 1 ? ' solo' : '';

  listEl.innerHTML = visible.map(g => `
    <section class="group${solo}">
      <h2>${g.label}</h2>
      ${g.items.map(it => `
        <article class="entry">
          <h3>${highlight(it.title)}</h3>
          <p class="by">${highlight(it.by)}<br>${esc(it.year)}</p>
          <p class="note">${highlight(it.note)}</p>
        </article>`).join('')}
    </section>`).join('');
}

function swap(fn) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { fn(); return; }
  listEl.classList.add('swapping');
  setTimeout(() => { fn(); listEl.classList.remove('swapping'); }, 120);
}

function readHash() {
  const h = location.hash.replace('#', '');
  const next = GROUPS.some(g => g.key === h) ? h : 'all';
  if (next === medium) return;
  medium = next;
  swap(render);
}

let t;
searchEl.addEventListener('input', () => {
  clearTimeout(t);
  t = setTimeout(() => { query = searchEl.value.trim(); render(); }, 120);
});

window.addEventListener('hashchange', readHash);

buildFilters();
readHash();
render();
</script>
